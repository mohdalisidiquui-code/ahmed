<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .circle{
            width: 100px;
            height: 100px;
            
            animation: 1s infinite ease-in-out; 
            display: flex;
            justify-content: space-around;
            align-items: center;

        }
        #circle1{
            background-color: red;
            border-radius: 100%;
            height: 20%;
            width: 20%;
        }
        
        #circle2{
            background-color: red;
            border-radius: 100%;
            height: 20%;
            width: 20%;
        }
        #circle3{
            background-color: red;
            border-radius: 100%;
            height: 20%;
            width: 20%;
        }
        #circle4{
            background-color: red;
            border-radius: 100%;
            height: 20%;
            width: 20%;
        }

        @keyframes popin {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1);
            }
            100% {
                transform: scale(0);
            }
        }
    </style>
    
<div class="circle">  
<div id="circle1"></div>
<div id="circle2"></div>
<div id="circle3"></div>
<div id="circle4"></div>
 </div>

</body>
</html>
